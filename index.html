<!doctype html>
<html lang="en" dir="ltr">

<head>
  <!-- ===================== Charset & Viewport ===================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ===================== Primary SEO Meta Tags ===================== -->
  <title>Ofzen Technologies</title>
  <meta name="description"
    content="Ofzen is a digital engineering and growth studio that designs and builds high-performance web apps, mobile apps, and custom software. From startups to enterprises — we deliver precision-crafted digital products." />
  <meta name="keywords"
    content="digital engineering, web development, app development, UI UX design, custom software, React development, startup studio, digital growth, Ofzen, India" />
  <meta name="author" content="Ofzen" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="theme-color" content="#135bec" />
  <meta name="color-scheme" content="light dark" />

  <!-- ===================== Canonical URL ===================== -->
  <link rel="canonical" href="https://ofzen.in/" />

  <!-- ===================== Geo & Language ===================== -->
  <meta name="geo.region" content="IN" />
  <meta name="geo.country" content="India" />
  <meta name="language" content="English" />

  <!-- ===================== Open Graph (Facebook / LinkedIn) ===================== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ofzen" />
  <meta property="og:title" content="Ofzen Technologies" />
  <meta property="og:description"
    content="We design and build digital products that work — from early-stage startups to growing enterprises. Web, app, and custom software development with precision engineering." />
  <meta property="og:url" content="https://ofzen.in/" />
  <meta property="og:image" content="https://ofzen.in/favicon.png" />
  <meta property="og:image:alt" content="Ofzen Technologies" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- ===================== Twitter / X Card ===================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@ofzen" />
  <meta name="twitter:creator" content="@ofzen" />
  <meta name="twitter:title" content="Ofzen Technologies" />
  <meta name="twitter:description"
    content="We design and build digital products that work — web, app, and custom software for startups and enterprises." />
  <meta name="twitter:image" content="https://ofzen.in/favicon.png" />
  <meta name="twitter:image:alt" content="Ofzen Technologies" />

  <!-- ===================== Favicon & App Icons ===================== -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="msapplication-TileImage" content="/favicon.png" />
  <meta name="msapplication-TileColor" content="#135bec" />

  <!-- ===================== JSON-LD Structured Data ===================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Ofzen",
    "alternateName": "Ofzen Technologies",
    "url": "https://ofzen.in",
    "logo": "https://ofzen.in/favicon.png",
    "description": "Ofzen is a digital engineering and growth studio that designs and builds high-performance web apps, mobile apps, and custom software solutions.",
    "email": "support@ofzen.in",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "IN"
    },
    "sameAs": [
      "https://www.linkedin.com/company/ofzen/",
      "https://www.instagram.com/ofzen.dev"
    ],
    "foundingDate": "2024",
    "areaServed": "Worldwide",
    "serviceType": [
      "Web Development",
      "App Development",
      "Custom Software Engineering",
      "UI/UX Design",
      "Digital Growth"
    ]
  }
  </script>

  <!-- ===================== Performance: Preconnect ===================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ===================== Google Fonts ===================== -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
